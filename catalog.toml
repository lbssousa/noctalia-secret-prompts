# Plugin source for Noctalia: add it with
#   noctalia msg plugins source add secret-prompts git https://github.com/lbssousa/noctalia-secret-prompts
# The plugin.toml in each plugin directory stays the source of truth.

[[plugin]]
id = "lbssousa/secret-prompts"
name = "Secret Prompts"
version = "1.0.0"
author = "lbssousa"
license = "MIT"
icon = "key"
description = "Answer gpg-agent (pinentry) and ssh/git (SSH_ASKPASS) prompts in a shell panel."
plugin_api = 42
tags = ["security", "utility"]
